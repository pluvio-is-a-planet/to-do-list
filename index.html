<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document</title><script defer="defer" src="main.js"></script></head><body><header class="header"><h1>TO-DOs</h1></header><main class="main"><div class="sidebar"><nav class="categories"><div class="home"><h2 class="category-header">Home</h2></div><div class="daily"><h2 class="category-header">Daily</h2></div><div class="weekly"><h2 class="category-header">Weekly</h2></div><div class="projects"><h2 class="category-header">Projects</h2><ul class="category-list hidden"></ul></div></nav><div class="actions"><div class="add-project"><button class="project-form-btn"></button><form action="#" class="project-form hidden"><div class="form-row"><input name="project-title" id="project-title"></div><div class="form-actions"><button type="button" class="cancel-btn">Close</button> <button type="submit">Add</button></div></form></div><div class="add-task"><button class="task-form-btn"></button><dialog class="task-form-dialog"><form class="task-form"><div class="form-row"><input name="task-title" id="task-title" required> <textarea name="task-description" id="task-description"></textarea></div><div class="form-row"><label for="task-due-date">Due date</label> <input type="date" name="task-due-date" id="task-due-date"></div><div class="form-row"><label for="task-priority">Priority</label> <select name="task-priority" id="task-priority"><option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option></select></div><div class="form-actions"><button type="button" class="cancel-btn">Cancel</button> <button type="submit">Add</button></div></form></dialog></div><div class="add-note"><button class="note-form-btn"></button><dialog class="note-form-dialog"><form class="note-form"><div class="form-row"><input name="note-title" id="note-title" required> <textarea name="note-description" id="note-description"></textarea></div>
